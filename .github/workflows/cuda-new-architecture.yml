name: cuda-new architecture

on:
  pull_request:
    paths:
      - 'crates/apxinf-cuda-new/**'
      - 'crates/apxinf-model/**'
      - 'doc/cuda-new-*.md'
      - 'scripts/check_cuda_new_architecture.py'
      - '.github/workflows/cuda-new-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_cuda_new_architecture.py
