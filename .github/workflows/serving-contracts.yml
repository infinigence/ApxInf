name: Serving CPU contracts
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/apxinf-serving/**'
      - 'python/apxinf/apxinf/serving/**'
      - 'scripts/apxinf_mlx_generate.py'
      - 'tests/fixtures/serving/**'
      - 'tests/python/test_serving*.py'
      - 'tests/python/test_apxinf_mlx_generate.py'
      - 'benchmarks/serving/**'
      - '.github/workflows/serving-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      APXINF_SERVING_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Select Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install CPU test dependencies
        run: python -m pip install 'numpy==2.5.4' 'Pillow==13.0.0'
      - name: Check Rust contracts and real HTTP transport
        run: cargo test --locked -p apxinf-serving -- --nocapture
      - name: Check Python contracts and CPU worker behavior
        run: |
          python -m unittest discover -s tests/python -p 'test_serving*.py' -v
          python tests/python/test_apxinf_mlx_generate.py -v
      - name: Retain CPU HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serving-cpu-http-${{ matrix.os }}
          path: devlocal/serving-http-integration/
          if-no-files-found: ignore
