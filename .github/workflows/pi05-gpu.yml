name: PI05 GPU gate
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Reviewed internal PR number
        required: true
      sha:
        description: Reviewed full PR head SHA
        required: true
permissions:
  contents: read
concurrency:
  group: pi05-pr-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr }}
          TESTED_SHA: ${{ inputs.sha }}
          ENABLED: ${{ vars.PI05_CI_ENABLED }}
          BANK_SHA: ${{ vars.PI05_CI_BANK_SHA256 }}
        with:
          script: |
            if (process.env.ENABLED !== 'true') throw new Error('GPU gate is not enabled');
            const repo = await github.rest.repos.get(context.repo);
            if (context.ref !== `refs/heads/${repo.data.default_branch}`)
              throw new Error('Dispatch from the reviewed default branch');
            if (!/^[0-9a-f]{40}$/.test(process.env.TESTED_SHA) ||
                !/^[0-9a-f]{64}$/.test(process.env.BANK_SHA) ||
                !/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Invalid inputs');
            const {data: pr} = await github.rest.pulls.get({...context.repo,
              pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open' || pr.head.sha !== process.env.TESTED_SHA ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`)
              throw new Error('Only the reviewed, current internal PR head is eligible');
            await github.rest.repos.createCommitStatus({...context.repo, sha: pr.head.sha,
              context: 'pi05/gpu', state: 'pending', description: 'Thor + Orin matrix queued',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
  gpu:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        board: [thor, orin]
    runs-on: [self-hosted, Linux, ARM64, '${{ matrix.board }}', pi05-ci]
    timeout-minutes: 60
    concurrency:
      group: pi05-board-${{ matrix.board }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Build and test with reviewed harness and frozen board assets
        env:
          TESTED_SHA: ${{ inputs.sha }}
          APXINF_CI_BANK_SHA256: ${{ vars.PI05_CI_BANK_SHA256 }}
          APXINF_CI_PREFLIGHT_SHA256: ${{ vars.PI05_CI_PREFLIGHT_SHA256 }}
          APXINF_CI_ENVIRONMENT_SHA256: ${{ vars[format('PI05_CI_{0}_ENVIRONMENT_SHA256', matrix.board)] }}
        run: >-
          bash trusted/scripts/run_pi05_ci.sh '${{ matrix.board }}' "$TESTED_SHA"
          "$GITHUB_WORKSPACE/candidate"
          "$GITHUB_WORKSPACE/candidate/devlocal/pi05-ci-gate/ci-${GITHUB_RUN_ID}"
      - name: Copy approved bank descriptor for hosted aggregation
        if: always()
        run: >-
          cp "$APXINF_CI_BANK"
          "$GITHUB_WORKSPACE/candidate/devlocal/pi05-ci-gate/ci-${GITHUB_RUN_ID}/bank.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi05-${{ matrix.board }}
          path: candidate/devlocal/pi05-ci-gate/ci-${{ github.run_id }}/
          if-no-files-found: error
  publish:
    needs: [authorize, gpu]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: devlocal/pi05-ci-gate/reports
          pattern: pi05-*
      - run: python -m pip install -r scripts/requirements-pi05-ci.txt
      - id: aggregate
        continue-on-error: true
        env:
          TESTED_SHA: ${{ inputs.sha }}
          BANK_SHA: ${{ vars.PI05_CI_BANK_SHA256 }}
        run: >-
          python scripts/pi05_ci.py aggregate
          --bank devlocal/pi05-ci-gate/reports/pi05-thor/bank.json
          --bank-sha256 "$BANK_SHA" --revision "$TESTED_SHA"
          --report devlocal/pi05-ci-gate/reports/pi05-thor/summary.json
          --report devlocal/pi05-ci-gate/reports/pi05-orin/summary.json
      - uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ inputs.sha }}
          PR_NUMBER: ${{ inputs.pr }}
          GPU_RESULT: ${{ needs.gpu.result }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo,
              pull_number: Number(process.env.PR_NUMBER)});
            const passed = pr.head.sha === process.env.TESTED_SHA &&
              process.env.GPU_RESULT === 'success' && process.env.AGGREGATE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({...context.repo, sha: process.env.TESTED_SHA,
              context: 'pi05/gpu', state: passed ? 'success' : 'failure',
              description: passed ? 'Complete Thor + Orin matrix passed' : 'Failed, incomplete, or stale evidence',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (!passed) core.setFailed('PI05 gate did not pass');
