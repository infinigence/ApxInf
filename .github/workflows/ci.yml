name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install actionlint
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python frontend
        run: pip install -e python/apxinf pytest sentencepiece

      # fmt-check is advisory: main carries pre-existing rustfmt drift
      # (~941 files); a cleanup PR should run `just fmt` separately.
      - name: fmt-check (advisory)
        run: just fmt-check
        continue-on-error: true

      # doc-lint and boundaries are deterministic and cheap; keep them
      # blocking. clippy currently reports ~500 warnings on main and stays
      # advisory until they are reduced.
      - name: doc-lint
        run: just doc-lint

      - name: Architecture boundaries
        run: just boundaries

      - name: Tooling regression tests
        run: just test-tooling

      - name: Workflow lint
        run: just workflow-lint

      # NOTE: `just check` compiles cfg(feature="cuda") code without a GPU;
      # the CUDA build scripts skip nvcc when no toolkit is present.
      - name: check
        run: just check

      - name: clippy (advisory)
        run: just clippy
        continue-on-error: true

      # CPU tests. Two root tests/ modules are excluded inside the recipe
      # (see doc/guides/testing.md); the remaining suite is blocking.
      - name: test-cpu
        run: just test-cpu
