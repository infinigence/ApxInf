name: Python wheel
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin pytest
      - name: Build CPU wheel
        run: maturin build --locked --release --auditwheel skip -m crates/apxinf-py/Cargo.toml --out dist
      - name: Install and check the published package surface
        run: |
          python -m venv /tmp/apxinf-wheel-test
          /tmp/apxinf-wheel-test/bin/python -m pip install dist/apxinf-*.whl
          /tmp/apxinf-wheel-test/bin/python -I scripts/check_python_install.py
          /tmp/apxinf-wheel-test/bin/python -m pip check
