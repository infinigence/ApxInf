[package]
name = "apxinf-cuda-new"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[features]
default = []
# Kept as an empty Cargo capability for cuda-new-specific profiling builds.
nvtx = []

[dependencies]
apxinf-core = { path = "../apxinf-core", features = ["quantized-dtypes"] }

[dev-dependencies]
half = { version = "2", features = ["bytemuck"] }
