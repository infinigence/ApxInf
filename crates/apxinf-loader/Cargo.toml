[package]
name = "apxinf-loader"
version = "0.1.0"
edition = "2021"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
thiserror = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"

[dev-dependencies]
tempfile = "3"
