[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
thiserror = "1"
once_cell = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cuda = ["dep:apxinf-cuda"]

[[example]]
name = "pi05_bench"
required-features = ["cuda"]

[[example]]
name = "pi05_integrity_probe"
required-features = ["cuda"]

[[example]]
name = "pi05_auto_smoke"
required-features = ["cuda"]

[[example]]
name = "multimodal_check"
required-features = ["cuda"]

[[example]]
name = "vision_check"
required-features = ["cuda"]
