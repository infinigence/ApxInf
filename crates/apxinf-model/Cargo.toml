[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-cuda-new = { package = "apxinf-cuda-new", path = "../apxinf-cuda-new", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
thiserror = "1"
once_cell = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cuda = ["dep:apxinf-cuda", "dep:apxinf-cuda-new"]
# Focused migration/qualification build. Other model families remain excluded
# until their executors call cuda-new L3 directly as PI0.5 now does.
pi05-only = ["cuda"]

[[example]]
name = "pi05_bench"
required-features = ["cuda"]

[[example]]
name = "gr00t_bench"
required-features = ["cuda"]

[[example]]
name = "pi05_integrity_probe"
required-features = ["cuda"]

[[example]]
name = "pi05_auto_smoke"
required-features = ["cuda"]

[[example]]
name = "pi0_fast_smoke"
required-features = ["cuda"]

[[example]]
name = "multimodal_check"
required-features = ["cuda"]

[[example]]
name = "vision_check"
required-features = ["cuda"]
