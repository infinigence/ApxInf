[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-cuda-new = { path = "../apxinf-cuda-new", optional = true }
apxinf-hip = { path = "../apxinf-hip", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
thiserror = "1"
once_cell = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Full NVIDIA CUDA inference: links both the legacy (`apxinf-cuda`) and the
# current (`apxinf-cuda-new`) runtimes and enables every CUDA model family.
cuda = ["dep:apxinf-cuda", "dep:apxinf-cuda-new"]
# Deprecated alias of `cuda`, kept so existing build commands keep working.
# It no longer gates anything: `cuda` already pulls in `apxinf-cuda-new`, and
# the model code that used to hide behind this flag now follows `cuda`.
cuda-new = ["cuda"]
# Deprecated alias of `cuda`. It gates nothing — `cuda` has always compiled the
# other model families too — and is kept only for existing build commands.
pi05-only = ["cuda"]
# AMD ROCm/HIP inference, independent of both CUDA features: either, both or
# neither can be enabled.
hip = ["dep:apxinf-hip"]

[[example]]
name = "pi05_bench"
required-features = ["cuda"]

[[example]]
name = "gr00t_bench"
required-features = ["cuda"]

[[example]]
name = "pi05_integrity_probe"
required-features = ["cuda"]

[[example]]
name = "pi05_auto_smoke"
required-features = ["cuda"]

[[example]]
name = "pi0_fast_smoke"
required-features = ["cuda"]

[[example]]
name = "multimodal_check"
required-features = ["cuda"]

[[example]]
name = "vision_check"
required-features = ["cuda"]

[[example]]
name = "qwen38_bench"
required-features = ["cuda"]
