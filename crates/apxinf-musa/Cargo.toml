[package]
name = "apxinf-musa"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[features]
default = ["mttx"]
# Range markers for msys profiling, backed by MTTX. Mirrors `apxinf-cuda/nvtx`.
mttx = []

[dependencies]
apxinf-core = { path = "../apxinf-core" }
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
