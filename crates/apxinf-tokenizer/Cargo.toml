[package]
name = "apxinf-tokenizer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
sentencepiece = ["dep:sentencepiece"]

[dependencies]
apxinf-core = { path = "../apxinf-core" }
tokenizers = "0.20"
sentencepiece = { version = "0.14", optional = true, features = ["static"] }
minijinja = "2"
# Python-compatible string/dict methods (startswith, endswith, ...) used by
# HF chat templates.
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
