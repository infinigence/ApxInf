[package]
name = "apxinf-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Lazy backend arrays retain thread-affine owners instead of device pointers.
# Opt in explicitly: on Apple Silicon macOS this makes Tensor !Send/!Sync.
# Inert on other targets, including unified Linux CUDA + MLX feature builds.
opaque-storage = []

[dependencies]
thiserror = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
