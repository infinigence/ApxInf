[package]
name = "apxinf-serving"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "apxinf-serve"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
futures-util = "=0.3.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }
clap = { version = "=4.5.23", features = ["derive"] }
