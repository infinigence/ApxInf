[package]
name = "apxinf-serving"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-model = { path = "../apxinf-model" }
apxinf-tokenizer = { path = "../apxinf-tokenizer" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-stream = "0.1"
base64 = "0.13"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
apxinf-loader = { path = "../apxinf-loader" }
