[workspace]
members = [
    "crates/apxinf-core",
    "crates/apxinf-cuda-new",
    "crates/apxinf-hip",
    "crates/apxinf-mlx",
    "crates/apxinf-loader",
    "crates/apxinf-model",
    "crates/apxinf-tokenizer",
    "crates/apxinf-py",
]

[package]
name = "apxinf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# CUDA GPU inference on the apxinf-cuda-new runtime. NVTX profiling markers
# auto-detect the available CUDA header/library in apxinf-cuda-new's build.
cuda = [
    "dep:apxinf-cuda-new",
    "apxinf-cuda-new/nvtx",
    "apxinf-model/cuda",
]
# Same runtime with NVTX compiled out entirely. Keep this separate from
# `cuda`: enabling `cuda` would also enable apxinf-cuda-new's `nvtx` feature.
cuda-no-nvtx = ["dep:apxinf-cuda-new", "apxinf-model/cuda"]
# Native Apple Metal execution through an explicitly configured MLX C++ SDK.
mlx = ["dep:apxinf-mlx", "apxinf-mlx/native", "apxinf-model/mlx"]
# Deprecated alias of `cuda`, kept so existing build commands keep working.
# `cuda` already links cuda-new and enables every CUDA model family, Qwen3.8
# included — see crates/apxinf-model/Cargo.toml.
cuda-new = ["cuda", "apxinf-model/cuda-new"]
# AMD ROCm/HIP inference. Independent of `cuda`: both may be enabled, and
# a process can then hold a CUDA and a HIP backend at once.
hip = ["dep:apxinf-hip", "apxinf-model/hip"]
# CPU-only BLAS backend for the non-GPU matmul fallback. Combine with `cuda`
# if you want the CPU path to use OpenBLAS. Drive OS aarch64 doesn't ship
# libopenblas — leave this off on Thor.
openblas = ["apxinf-core/openblas"]

[dependencies]
apxinf-core = { path = "crates/apxinf-core" }
apxinf-cuda-new = { path = "crates/apxinf-cuda-new", optional = true }
apxinf-mlx = { path = "crates/apxinf-mlx", optional = true }
apxinf-hip = { path = "crates/apxinf-hip", optional = true }
apxinf-loader = { path = "crates/apxinf-loader" }
apxinf-model = { path = "crates/apxinf-model" }
apxinf-tokenizer = { path = "crates/apxinf-tokenizer" }
clap = { version = "=4.5.23", features = ["derive"] }
serde_json = "1"
half = "2"
